<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Maths Trail</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23e8f3ff'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='28' font-family='Arial' font-weight='700' fill='%231d4ed8'%3EM%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="mode-tabs" aria-label="화면 선택">
        <button class="tab is-active" data-view="trail" type="button">Trail</button>
        <button class="tab" data-view="all" type="button">전체 문제</button>
      </nav>
    </header>

    <main>
      <section class="view is-active" id="trail-view" aria-labelledby="trail-title">
        <div class="work-layout">
          <aside class="left-rail">
            <section class="trail-board" aria-labelledby="trail-title">
              <div>
                <p class="eyebrow">기록지</p>
                <h2 id="trail-title">Circle Number</h2>
              </div>
              <div class="trail-diagram" id="trail-diagram" aria-label="선택한 circle number 기록"></div>
            </section>

            <section class="panel start-panel">
              <h2>시작 번호</h2>
              <div class="circle-picker" id="start-picker"></div>
              <div class="status-box" id="status-box"></div>
              <div class="action-row">
                <button class="secondary" id="restart-run" type="button">처음부터</button>
                <button class="secondary" id="undo-run" type="button">마지막 삭제</button>
              </div>
            </section>

            <section class="panel answer-panel">
              <h2>Previous Answer 선택</h2>
              <div class="answer-grid" id="answer-grid"></div>
            </section>
          </aside>

          <section class="problem-stage" aria-live="polite">
            <div class="stage-header">
              <div>
                <p class="eyebrow">현재 문제</p>
                <h2 id="current-title">Circle 1</h2>
              </div>
              <button class="secondary" id="show-current-in-all" type="button">전체에서 보기</button>
            </div>
            <img class="problem-image" id="current-problem" alt="현재 문제 이미지" />
          </section>
        </div>
      </section>

      <section class="view" id="all-view" aria-labelledby="all-title">
        <div class="all-header">
          <div>
            <p class="eyebrow">전체 Maths Trail</p>
            <h2 id="all-title">문제 전체 보기</h2>
          </div>
        </div>
        <div class="all-grid" id="all-cards"></div>
      </section>
    </main>

    <template id="answer-template">
      <button class="answer-choice" type="button">
        <span class="choice-number"></span>
        <img alt="" />
      </button>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
